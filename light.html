:root{
  --void:#f2ede3; --panel:#ffffff; --panel-2:#faf7f1; --hairline:#222b3814;
  --text:#222b38f2; --dim:#222b38b8; --faint:#222b388c;
  --ink:#222b38; --paper:#f2ede3; --paper-shade:#e6dfd1;
  --cobalt:#2d55c0; --signal:#0b5fcc; --alert:#c4291f;
  /* chart series — recontrasted for a light --panel, all four ≥4.5:1 on --void */
  --s-in:#1565c0; --s-out:#8c5b09; --s-steam:#0c7a68; --s-derived:#4a3fb0;
  --serif:'Source Serif 4',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--void);color:var(--text);font-family:var(--sans);font-weight:500}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
main{width:min(1760px,100%);margin:0 auto;padding:0 clamp(16px,3vw,48px) 40px;flex:1}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:24px;width:min(1760px,100%);margin:0 auto;
  padding:clamp(14px,2vh,26px) clamp(16px,3vw,48px)}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.brand b{color:var(--text);font-weight:500}
.tabs{display:flex;gap:6px;margin-inline:auto;background:var(--panel);border:1px solid var(--hairline);border-radius:99px;padding:4px}
.tab{font-family:var(--mono);font-size:14px;padding:8px 22px;border-radius:99px;color:var(--faint);transition:color .2s var(--ease),background .2s var(--ease)}
.tab:hover{color:var(--dim)}
.tab[aria-selected="true"]{background:var(--cobalt);color:#f7f3ec}
.live{font-family:var(--mono);font-size:13px;color:var(--faint);display:flex;align-items:center;gap:10px;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--alert);box-shadow:0 0 8px var(--alert)}
@media (prefers-reduced-motion:no-preference){.live .dot{animation:beat 2s infinite}}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--hairline);border-radius:14px}
.stage{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:stretch}
.schematic-panel{padding:clamp(14px,1.8vw,28px);display:flex;flex-direction:column}
.panel-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:12px;color:var(--dim);border:1px solid var(--hairline);border-radius:99px;padding:3px 12px;background:#222b3808}
#schematic{flex:1;min-height:0}
#schematic svg{width:100%;height:auto;display:block}
/* schematic drawing */
.sh-body{fill:#222b3805;stroke:#222b382e;stroke-width:2}
.sh-wbox{fill:#2d55c03d;stroke:#2456b0;stroke-width:1.5}
.sh-dome{fill:#0b5fcc14;stroke:#2456b0;stroke-width:1.5}
.sh-bank{fill:none;stroke:#222b3833;stroke-width:1.2;stroke-dasharray:5 5}
.sh-hotwell{fill:none;stroke:#222b382e;stroke-width:1.5}
.sh-lbl{font-family:var(--mono);font-size:15px;fill:var(--faint)}
.sh-lbl.bright{fill:var(--dim)}
.sh-cap{font-family:var(--mono);font-size:15px;fill:var(--faint)}
.sh-flow{stroke-width:2;fill:none}
.sh-arrowlbl{font-family:var(--mono);font-size:14px;fill:#1f5aa8}
.pin{fill:#2456b0}
.sensor{cursor:pointer}
.sensor .chip{fill:var(--panel);stroke:var(--hairline);rx:8}
.sensor:hover .chip{stroke:#222b3845}
.sensor.sel .chip{stroke:var(--signal);stroke-width:1.6}
.sensor .cv{font-family:var(--mono);font-size:16px;fill:var(--text)}
.sensor .cl{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;fill:var(--faint)}
.sdot{r:4}
@media (prefers-reduced-motion:no-preference){
  .sensor.sel .sdot{animation:beat 2s infinite}
  .sh-flow-anim{stroke-dasharray:10 14;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-24}}
}
/* ---------- right rail ---------- */
.rail{display:flex;flex-direction:column;gap:20px;min-width:0}
.paper-card{background:var(--paper);color:var(--ink);border-radius:14px;padding:24px 26px;
  border:1px solid rgba(34,43,56,.12); box-shadow:0 20px 50px rgba(34,43,56,.10);
  background-image:linear-gradient(160deg,var(--paper) 55%,var(--paper-shade))}
.paper-card h2{font-family:var(--serif);font-weight:700;font-size:clamp(22px,1.8vw,30px);line-height:1.1;margin-bottom:2px}
.paper-card .sub{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#222b38a3;margin-bottom:12px}
.paper-card p{font-size:14.5px;line-height:1.55;color:#222b38d9}
.design-point{padding:20px 24px}
.design-point h3{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:500;margin-bottom:10px}
.design-point dl{display:grid;grid-template-columns:1fr auto;row-gap:0;font-size:14px}
.design-point .row{display:contents}
.design-point dt{color:var(--faint);padding:6.5px 0;border-top:1px solid var(--hairline)}
.design-point dd{font-family:var(--mono);color:var(--dim);padding:6.5px 0;border-top:1px solid var(--hairline);text-align:right;font-variant-numeric:tabular-nums}
.design-point .row:first-child dt,.design-point .row:first-child dd{border-top:none}
/* ---------- series panel ---------- */
.series-panel{margin-top:20px;padding:clamp(14px,1.8vw,26px)}
.series-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.series-title{display:flex;align-items:baseline;gap:12px;min-width:0}
.series-title h2{font-family:var(--serif);font-weight:600;font-size:clamp(18px,1.5vw,24px);white-space:nowrap}
#chartNow{font-family:var(--mono);font-size:14px;color:var(--faint)}
.controls{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pills{display:flex;gap:4px;background:#222b3808;border:1px solid var(--hairline);border-radius:99px;padding:3px}
.pill{font-family:var(--mono);font-size:12.5px;padding:6px 14px;border-radius:99px;color:var(--faint);white-space:nowrap}
.pill:hover{color:var(--dim)}
.pill[aria-pressed="true"]{background:#2d55c066;color:var(--text)}
.chart-wrap{position:relative}
#chart svg{width:100%;height:auto;display:block}
.grid line{stroke:#222b3810}
.axis text{font-family:var(--mono);font-size:12.5px;fill:var(--faint)}
.baseline{stroke:#222b3828}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.endlbl text{font-family:var(--mono);font-size:12.5px;fill:var(--dim)}
.crosshair{stroke:#222b3840;stroke-dasharray:3 4}
#tooltip{position:absolute;pointer-events:none;background:var(--panel-2);border:1px solid #222b3824;border-radius:10px;
  padding:10px 13px;font-family:var(--mono);font-size:12.5px;color:var(--dim);display:none;z-index:5;min-width:150px;box-shadow:0 8px 24px rgba(34,43,56,.22)}
#tooltip .tt-t{color:var(--faint);margin-bottom:6px}
#tooltip .tt-row{display:flex;align-items:center;gap:8px;padding:1.5px 0;white-space:nowrap}
#tooltip .tt-row i{width:8px;height:8px;border-radius:50%;flex:none}
#tooltip .tt-row b{margin-left:auto;color:var(--text);font-weight:500;padding-left:14px}
.legend{display:flex;gap:16px;margin-left:2px;margin-top:8px;flex-wrap:wrap}
.legend span{font-family:var(--mono);font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%}
#tableView{margin-top:14px;max-height:300px;overflow:auto;border:1px solid var(--hairline);border-radius:10px}
#tableView table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
#tableView th,#tableView td{text-align:right;padding:6px 14px;border-bottom:1px solid var(--hairline);color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
#tableView th{position:sticky;top:0;background:var(--panel-2);color:var(--faint)}
#tableView th:first-child,#tableView td:first-child{text-align:left}
/* bundle strip */
.bundles{display:none;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hairline)}
.bundles.on{display:grid;grid-template-columns:auto repeat(8,1fr)}
.bundles .b-cap{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.bundle{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 6px;border-radius:10px;border:1px solid transparent}
.bundle:hover{background:#222b3806}
.bundle.sel{border-color:var(--signal)}
.bundle .bar{width:100%;max-width:64px;height:64px;position:relative;border-radius:6px;background:#222b3808;overflow:hidden}
.bundle .fill{position:absolute;left:0;right:0;bottom:0;background:var(--cobalt);border-radius:4px 4px 0 0}
.bundle.hot .fill{background:var(--alert)}
.bundle .lim{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed #222b3859}
.bundle .bv{font-family:var(--mono);font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.bundle .bl{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.bundle.hot .bl::after{content:" ⚠";color:var(--alert)}
.foot{width:min(1760px,100%);margin:0 auto;padding:14px clamp(16px,3vw,48px) 22px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--faint)}
@media (max-width:1150px){.stage{grid-template-columns:1fr}.rail{flex-direction:row}.rail>*{flex:1}}
@media (max-width:950px){.bundles.on{grid-template-columns:repeat(4,1fr)}
  .bundles .b-cap{writing-mode:horizontal-tb;transform:none;grid-column:1/-1;text-align:left}}
@media (max-width:760px){.rail{flex-direction:column}.top{flex-wrap:wrap;justify-content:center}.tabs{margin-inline:0;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<footer class="foot">demonstration units · telemetry synthesized from each specification's design point · no plant-identifying data</footer>
<script src="data/plant-data.js"></script><!-- optional real-data override; safe to 404 -->
<script>
'use strict';
/* ================================================================
   STORY — EDIT ME. Shapes what the demo telemetry "says".
   fouling: 0..1 — how much cleanliness has degraded over the 30-day
     window (drives TTD creep + backpressure rise, the "slow drift
     nobody sees" story). weatherAmp: diurnal CW-inlet swing, °F.
   bundleCreep (Sample A): one zone's DP ramps from→to (inH₂O)
     across the window — the air-binding story. limit is 1.0.
   ================================================================ */
const STORY = {
  A: { fouling: 0.18, weatherAmp: 3.0, bundleCreep: { zone: 'B03', from: 0.34, to: 0.92 } },
  B: { fouling: 0.55, weatherAmp: 2.4 }
};
/* ---------------- plant specifications (from the platform) ------- */
const C = { in:'#1565c0', out:'#8c5b09', steam:'#0c7a68', derived:'#4a3fb0' };
const PLANTS = {
  A: {
    name:'Sample A',
    desc:'Demonstration unit — single-pressure, single-pass, twin-bank surface condenser with a divided West/East waterbox and eight metered steam-side bundles.',
    badges:['1 pass','2 streams','8 bundles'],
    caption:'48.0 ft tubes · 15,744 tubes · 1 pass · 8 bundles',
    design:{ 'CW flow':'156,000 gpm','Inlet / outlet':'85.0 / 105.0 °F','Back pressure':'2.50 inHgA',
      'Steam saturation':'108.7 °F','TTD':'3.7 °F','Heat duty':'1,552 MBTU/hr',
      'U design (HEI)':'588.9','Tube velocity':'6.0 ft/s' },
    inT:85.0, rise:20.0, tsat:108.7, bp:2.50, ttd:3.7, vel:'6.0', flow:'156,000 gpm',
    bundles:8, dpBase:[0.31,0.44,0.34,0.52,0.38,0.47,0.29,0.41], dpLimit:1.0
  },
  B: {
    name:'Sample B',
    desc:'Demonstration unit — twin-shell, dual-pressure, single-pass surface condenser with divided waterboxes and the circulating water routed in series through the L.P. and H.P. shells.',
    badges:['2 shells in series','1 pass','1 stream'],
    caption:'50.0 ft tubes · 32,450 tubes · 1 pass · 2 shells in series',
    design:{ 'CW flow':'180,000 gpm','Inlet / outlet':'87.0 / 117.4 °F','L.P. shell':'2.65 inHgA · 110.6 °F',
      'H.P. shell':'3.93 inHgA · 124.7 °F','Steam saturation':'117.6 °F','TTD':'7.3 °F',
      'Heat duty':'2,723 MBTU/hr','Tube velocity':'6.8 ft/s' },
    inT:87.0, rise:30.4, riseSplit:0.5, tsatLP:110.6, tsatHP:124.7, bpLP:2.65, bpHP:3.93, ttd:7.3,
    vel:'6.8', flow:'180,000 gpm', bundles:0
  }
};
/* ---------------- deterministic data generation ------------------ */
const MIN10 = 10*60*1000, N = 30*24*6;                 // 30 days @ 10-min
const T0 = Date.now() - (N-1)*MIN10;
function prng(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
function walk(rnd,n,amp){ const w=new Float64Array(n); let v=0;
  for(let i=1;i<n;i++){ v=(v+(rnd()-0.5)*amp)*0.995; w[i]=v; } return w; }
const bpFromTsat = (tsat,refBP,refT)=> refBP*Math.exp(0.0308*(tsat-refT));
function generate(key){
  const P=PLANTS[key], S=STORY[key], rnd=prng(key==='A'?101:202);
  const weather=walk(rnd,N,0.45), loadW=walk(rnd,N,0.06);
  const s={cwIn:[],cwOut:[],ttd:[],air:[]};
  if(key==='A'){ s.cwOutW=[]; s.cwOutE=[]; s.bp=[]; for(let b=1;b<=8;b++) s['b0'+b]=[]; }
  else { s.cwMid=[]; s.bpLP=[]; s.bpHP=[]; }
  for(let i=0;i<N;i++){
    const t=T0+i*MIN10, h=new Date(t).getHours()+new Date(t).getMinutes()/60;
    const prog=i/(N-1);                                    // 0 → 1 over 30 days
    const diurnal=Math.sin((h-15)/24*2*Math.PI);           // peaks mid-afternoon
    const inT=P.inT-0.6+S.weatherAmp*diurnal+weather[i]*0.65+(rnd()-0.5)*0.24;
    const load=1+0.04*Math.sin((h-18)/24*2*Math.PI)+loadW[i];
    const foul=1+S.fouling*prog*0.10;                      // rise grows as tubes foul
    const rise=P.rise*load*foul;
    const outT=inT+rise+(rnd()-0.5)*0.2;
    const ttd=P.ttd*(1+S.fouling*prog*0.42)+(rnd()-0.5)*0.10;
    s.cwIn.push(inT); s.cwOut.push(outT); s.ttd.push(ttd);
    s.air.push(1.0+Math.max(0,weather[i]*0.06)+rnd()*0.12);
    if(key==='A'){
      s.cwOutW.push(outT-0.4+(rnd()-0.5)*0.3); s.cwOutE.push(outT+0.4+(rnd()-0.5)*0.3);
      s.bp.push(bpFromTsat(outT+ttd,2.50,108.7));
      for(let b=1;b<=8;b++){
        let v=P.dpBase[b-1]+(rnd()-0.5)*0.05;
        if(S.bundleCreep && 'B0'+b===S.bundleCreep.zone)
          v=S.bundleCreep.from+(S.bundleCreep.to-S.bundleCreep.from)*Math.pow(prog,1.6)+(rnd()-0.5)*0.05;
        s['b0'+b].push(v);
      }
    } else {
      const mid=inT+rise*P.riseSplit+(rnd()-0.5)*0.2; s.cwMid.push(mid);
      s.bpLP.push(bpFromTsat(mid+ttd*1.15,2.65,110.6)); /* 110.6 design = interstage 102.2 + 1.15·TTD */
      s.bpHP.push(bpFromTsat(outT+ttd,3.93,124.7));
    }
  }
  return s;
}
const DATA={A:null,B:null};
function dataFor(k){
  if(!DATA[k]){
    DATA[k]=generate(k);
    const ext=(window.PLANT_DATA&&window.PLANT_DATA[k]&&window.PLANT_DATA[k].series)||{};
    for(const key in ext) if(Array.isArray(ext[key])&&ext[key].length>1) DATA[k][key]=ext[key]; // per-key override, rest stays synthesized
  }
  return DATA[k];
}
const last=a=>a[a.length-1];
const f1=v=>v.toFixed(1), f2=v=>v.toFixed(2);
/* live-tick jitter: one offset per key per tick so chip values breathe */
let TICK={};
const lv=(k,arr,amp)=>last(arr)+(TICK[k]??=(Math.random()-0.5)*2)*amp;
/* ---------------- sensors & chart presets ------------------------ */
const SENSORS = {
  A: [
    {id:'cwIn',  name:'CW inlet',      unit:'°F',    color:C.in,     fmt:f1},
    {id:'cwOutW',name:'CW outlet · W', unit:'°F',    color:C.out,    fmt:f1},
    {id:'cwOutE',name:'CW outlet · E', unit:'°F',    color:C.out,    fmt:f1},
    {id:'bp',    name:'Back pressure', unit:'inHgA', color:C.steam,  fmt:f2},
    {id:'air',   name:'Air off-take',  unit:'SCFM',  color:C.derived,fmt:f1},
  ],
  B: [
    {id:'cwIn', name:'CW inlet',       unit:'°F',    color:C.in,     fmt:f1},
    {id:'cwMid',name:'CW interstage',  unit:'°F',    color:C.in,     fmt:f1},
    {id:'cwOut',name:'CW outlet',      unit:'°F',    color:C.out,    fmt:f1},
    {id:'bpLP', name:'L.P. shell BP',  unit:'inHgA', color:C.steam,  fmt:f2},
    {id:'bpHP', name:'H.P. shell BP',  unit:'inHgA', color:C.out,    fmt:f2},
    {id:'air',  name:'Air off-take',   unit:'SCFM',  color:C.derived,fmt:f1},
  ]
};
for(let b=1;b<=8;b++) SENSORS.A.push({id:'b0'+b,name:'Bundle B0'+b+' ΔP',unit:'inH₂O',color:C.steam,fmt:f2});
const PRESETS = {
  A: [
    {id:'inout',label:'In vs out',title:'Inlet vs outlet',unit:'°F',keys:['cwIn','cwOutW','cwOutE']},
    {id:'ttd',  label:'TTD',      title:'Terminal temperature difference',unit:'°F',keys:['ttd']},
    {id:'bp',   label:'Back pressure',title:'Back pressure',unit:'inHgA',keys:['bp']},
  ],
  B: [
    {id:'inout',label:'In · mid · out',title:'CW temperature through the shells',unit:'°F',keys:['cwIn','cwMid','cwOut']},
    {id:'ttd',  label:'TTD',      title:'Terminal temperature difference',unit:'°F',keys:['ttd']},
    {id:'bp',   label:'L.P. vs H.P.',title:'Shell back pressures',unit:'inHgA',keys:['bpLP','bpHP']},
  ]
};
const SERIES_META = k => {
  const m={ ttd:{name:'TTD',color:C.derived,fmt:f1} };
  SENSORS[k].forEach(s=>m[s.id]={name:s.name,color:s.color,fmt:s.fmt});
  if(k==='B') m.cwMid={name:'CW interstage',color:'#156a9e',fmt:f1};   /* lighter step of the inlet hue */
  if(k==='A'){ m.cwOutE={name:'CW outlet · E',color:'#8a5c0a',fmt:f1};} /* darker step of the outlet hue */
  m.cwOut={name:'CW outlet',color:C.out,fmt:f1};
  return m;
};
const RANGES=[{id:'24h',label:'24h',pts:144},{id:'7d',label:'7d',pts:1008},{id:'30d',label:'30d',pts:N}];
/* ---------------- state ------------------------------------------ */
const state={plant:'A',preset:'inout',sensor:null,range:'24h',table:false};
const $=id=>document.getElementById(id);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------------- schematic -------------------------------------- */
function chipW(label,val){ return Math.max(label.length,val.length)*9.6+26; }
function sensorChip(id,label,val,x,y,color,anchor){
  const w=chipW(label,val), h=46, ax=anchor==='end'?x-w:anchor==='middle'?x-w/2:x;
  const sel=state.sensor===id?' sel':'';
  return `<g class="sensor${sel}" data-sensor="${id}" tabindex="0" role="button"
    aria-label="${label} ${val}. Show trend.">
    <rect class="chip" x="${ax}" y="${y}" width="${w}" height="${h}" rx="9"/>
    <circle class="sdot" cx="${ax+14}" cy="${y+15}" r="4" fill="${color}"/>
    <text class="cl" x="${ax+24}" y="${y+19}">${label}</text>
    <text class="cv" x="${ax+13}" y="${y+38}">${val}</text></g>`;
}
function arrow(x1,y1,x2,y2,color,w){
  const a=Math.atan2(y2-y1,x2-x1),s=9;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w||2.5}"/>
   <path d="M${x2},${y2} L${x2-s*Math.cos(a-0.42)},${y2-s*Math.sin(a-0.42)} L${x2-s*Math.cos(a+0.42)},${y2-s*Math.sin(a+0.42)} Z" fill="${color}"/>`;
}
function bankArrows(x1,x2,ys){ let o='';
  ys.forEach(y=>{o+=`<line class="sh-flow sh-flow-anim" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="url(#flowGrad)"/>
    <path d="M${x2+2},${y} l-10,-4.5 v9 Z" fill="#2456b0"/>`;}); return o; }
function domePins(cx1,cx2,y){ return [cx1,cx2].map(x=>`<circle class="pin" cx="${x}" cy="${y}" r="4.5"/><line x1="${x}" y1="${y}" x2="${x}" y2="${y+12}" stroke="#2456b0" stroke-width="1.5"/>`).join(''); }
function diamonds(xs,y,plantKey){
  const d=dataFor(plantKey);
  return xs.map((x,i)=>{ const id='b0'+(i+1), hot=last(d[id])>=PLANTS.A.dpLimit*0.85;
    return `<g class="sensor${state.sensor===id?' sel':''}" data-sensor="${id}" tabindex="0" role="button" aria-label="Bundle ${id.toUpperCase()} differential pressure">
      <rect x="${x-13}" y="${y-13}" width="26" height="26" fill="transparent"/>
      <path d="M${x},${y-7} l7,7 l-7,7 l-7,-7 Z" fill="${hot?'#c4291f':'#2456b0'}"/></g>`; }).join('');
}
function schematicA(){
  const d=dataFor('A'), inT=f1(lv('a.in',d.cwIn,0.08)), outW=f1(lv('a.ow',d.cwOutW,0.08)), outE=f1(lv('a.oe',d.cwOutE,0.08)),
        bp=f2(lv('a.bp',d.bp,0.012)), tsat=f1(last(d.cwOut)+last(d.ttd)), air=f1(lv('a.air',d.air,0.04));
  const bxs=[...Array(8)].map((_,i)=>288+i*92);
  return `<svg viewBox="0 0 1200 620" role="img">
   <defs><linearGradient id="flowGrad" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="1030" y2="0">
     <stop offset="0" stop-color="${C.in}"/><stop offset="1" stop-color="${C.out}"/></linearGradient></defs>
   ${arrow(640,44,640,86,'#1f5aa8')}<text class="sh-arrowlbl" x="640" y="34" text-anchor="middle">turbine exhaust</text>
   <path class="sh-dome" d="M430,190 L520,96 L760,96 L850,190 Z"/>
   ${domePins(560,720,112)}
   <path d="M474,150 L474,122 L380,122" fill="none" stroke="#1f5aa8" stroke-width="1.8"/>${arrow(380,122,352,122,'#1f5aa8',1.8)}
   <rect class="sh-body" x="200" y="190" width="800" height="240" rx="6"/>
   <path class="sh-wbox" d="M200,190 h-40 a34,34 0 0 0 -34,34 v172 a34,34 0 0 0 34,34 h40 Z"/>
   <path class="sh-wbox" d="M1000,190 h40 a34,34 0 0 1 34,34 v172 a34,34 0 0 1 -34,34 h-40 Z"/>
   <rect class="sh-bank" x="232" y="222" width="736" height="86" rx="8"/>
   <rect class="sh-bank" x="232" y="322" width="736" height="86" rx="8"/>
   <text class="sh-lbl" x="248" y="240">West half</text><text class="sh-lbl" x="248" y="340">East half</text>
   ${bankArrows(348,900,[250,268,286])}${bankArrows(348,900,[350,368,386])}
   ${diamonds(bxs,205,'A')}
   <rect class="sh-hotwell" x="470" y="430" width="340" height="44"/>
   <text class="sh-lbl" x="640" y="458" text-anchor="middle">hotwell</text>
   <text class="sh-lbl bright" x="600" y="420" text-anchor="middle">v ≈ ${PLANTS.A.vel} ft/s</text>
   ${arrow(163,505,163,436,C.in,3)}${arrow(1037,436,1037,505,C.out,3)}
   ${sensorChip('bp','2 taps · Tsat '+tsat+' °F',bp+' inHgA',640,128,C.steam,'middle')}
   ${sensorChip('air','air off-take',air+' SCFM',342,99,C.derived,'end')}
   ${sensorChip('cwIn',PLANTS.A.flow+' · inlet',inT+' °F',96,516,C.in,'start')}
   ${sensorChip('cwOutW','out W',outW+' °F',852,516,C.out,'start')}
   ${sensorChip('cwOutE','out E',outE+' °F',986,516,C.out,'start')}
   <text class="sh-cap" x="600" y="600" text-anchor="middle">${PLANTS.A.caption}</text></svg>`;
}
function schematicB(){
  const d=dataFor('B'), inT=f1(lv('b.in',d.cwIn,0.08)), mid=f1(lv('b.mid',d.cwMid,0.08)), outT=f1(lv('b.out',d.cwOut,0.08)),
        lp=f2(lv('b.lp',d.bpLP,0.012)), hp=f2(lv('b.hp',d.bpHP,0.012)), air=f1(lv('b.air',d.air,0.04));
  const shell=(x,tag)=>`<rect class="sh-body" x="${x}" y="210" width="330" height="200" rx="6"/>
   <path class="sh-wbox" d="M${x},210 h-34 a30,30 0 0 0 -30,30 v140 a30,30 0 0 0 30,30 h34 Z"/>
   <path class="sh-wbox" d="M${x+330},210 h34 a30,30 0 0 1 30,30 v140 a30,30 0 0 1 -30,30 h-34 Z"/>
   <rect class="sh-bank" x="${x+26}" y="242" width="278" height="136" rx="8"/>
   <text class="sh-lbl" x="${x+40}" y="264">${tag} tube bank</text>
   ${bankArrows(x+66,x+264,[292,320,348])}
   <path class="sh-dome" d="M${x+70},210 L${x+120},128 L${x+210},128 L${x+260},210 Z"/>
   ${domePins(x+140,x+190,193)}
   <rect class="sh-hotwell" x="${x+90}" y="410" width="150" height="36"/>
   <text class="sh-lbl" x="${x+165}" y="434" text-anchor="middle">hotwell</text>`;
  return `<svg viewBox="0 0 1200 620" role="img">
   <defs><linearGradient id="flowGrad" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="1030" y2="0">
     <stop offset="0" stop-color="${C.in}"/><stop offset="1" stop-color="${C.out}"/></linearGradient></defs>
   ${arrow(310,52,310,120,'#1f5aa8')}<text class="sh-arrowlbl" x="310" y="42" text-anchor="middle">turbine exhaust</text>
   ${arrow(890,52,890,120,'#1f5aa8')}
   <path d="M240,168 L160,168" fill="none" stroke="#1f5aa8" stroke-width="1.8"/>${arrow(160,168,134,168,'#1f5aa8',1.8)}
   ${shell(145,'L.P.')}${shell(725,'H.P.')}
   <path d="M509,390 h60 v-70 h92" fill="none" stroke="url(#flowGrad)" stroke-width="5" opacity="0.85"/>
   ${arrow(655,320,661,320,'#2456b0',4)}
   <text class="sh-lbl bright" x="614" y="290" text-anchor="middle">series CW</text>
   <text class="sh-lbl bright" x="310" y="470" text-anchor="middle">v ≈ ${PLANTS.B.vel} ft/s</text>
   ${arrow(105,505,105,412,C.in,3)}${arrow(1105,412,1105,505,C.out,3)}
   ${sensorChip('bpLP','L.P. · Tsat '+f1(last(d.cwMid)+last(d.ttd)*1.15)+' °F',lp+' inHgA',310,142,C.steam,'middle')}
   ${sensorChip('bpHP','H.P. · Tsat '+f1(last(d.cwOut)+last(d.ttd))+' °F',hp+' inHgA',890,142,C.out,'middle')}
   ${sensorChip('air','air off-take',air+' SCFM',60,96,C.derived,'start')}
   ${sensorChip('cwIn',PLANTS.B.flow+' · inlet',inT+' °F',60,516,C.in,'start')}
   ${sensorChip('cwMid','interstage',mid+' °F',530,438,C.in,'start')}
   ${sensorChip('cwOut','out · 3 therm',outT+' °F',1000,516,C.out,'start')}
   <text class="sh-cap" x="600" y="600" text-anchor="middle">${PLANTS.B.caption}</text></svg>`;
}
/* ---------------- chart ------------------------------------------ */
let chartGeom=null;
function visibleSeries(){
  const k=state.plant, meta=SERIES_META(k);
  if(state.sensor){ const m=meta[state.sensor];
    return {title:m.name,unit:(SENSORS[k].find(s=>s.id===state.sensor)||{unit:''}).unit||'°F',
      keys:[state.sensor],meta}; }
  const p=PRESETS[k].find(p=>p.id===state.preset)||PRESETS[k][0];
  return {title:p.title,unit:p.unit,keys:p.keys,meta};
}
function niceTicks(lo,hi,n){
  const span=hi-lo||1, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)||10*mag;
  const t=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) t.push(v); return t;
}
function drawChart(){
  const k=state.plant, d=dataFor(k), vs=visibleSeries(), range=RANGES.find(r=>r.id===state.range);
  const W=1560,H=380,ML=74,MR=170,MT=18,MB=44, iw=W-ML-MR, ih=H-MT-MB;
  let raw=vs.keys.map(key=>{const a=d[key];return a.slice(Math.max(0,a.length-range.pts));});
  const minLen=Math.min(...raw.map(a=>a.length)); raw=raw.map(a=>a.slice(a.length-minLen));
  const stride=Math.max(1,Math.floor(minLen/390));
  const pts=raw.map(a=>{const o=[];for(let i=0;i<a.length;i+=stride)o.push(a[i]);
    if((a.length-1)%stride)o.push(a[a.length-1]);return o;});
  const n=pts[0].length, now=Date.now(),
        tAt=i=>now-((minLen-1)-Math.min(i*stride,minLen-1))*MIN10; // series are end-anchored at "now"
  let lo=Infinity,hi=-Infinity; pts.forEach(a=>a.forEach(v=>{if(v<lo)lo=v;if(v>hi)hi=v;}));
  const pad=(hi-lo)*0.12||1; lo-=pad; hi+=pad;
  const X=i=>ML+iw*i/(n-1), Y=v=>MT+ih*(1-(v-lo)/(hi-lo));
  const yT=niceTicks(lo,hi,5);
  let g='<g class="grid">'+yT.map(v=>`<line x1="${ML}" x2="${W-MR}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('')+'</g>';
  g+='<g class="axis">'+yT.map(v=>`<text x="${ML-10}" y="${Y(v)+4}" text-anchor="end">${(hi-lo)<3?v.toFixed(2):v.toFixed(1)}</text>`).join('');
  const xtn=state.range==='24h'?6:state.range==='7d'?7:6;
  for(let j=0;j<=xtn;j++){ const i=Math.round((n-1)*j/xtn), t=new Date(tAt(i));
    const lbl=state.range==='24h'?String(t.getHours()).padStart(2,'0')+':00':(t.getMonth()+1)+'/'+t.getDate();
    g+=`<text x="${X(i)}" y="${H-16}" text-anchor="middle">${lbl}</text>`; }
  g+='</g>'+`<line class="baseline" x1="${ML}" x2="${W-MR}" y1="${MT+ih}" y2="${MT+ih}"/>`;
  const lys=vs.keys.map((k,si)=>({si,y:Y(last(pts[si]))})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lys.length;i++) if(lys[i].y-lys[i-1].y<20) lys[i].y=lys[i-1].y+20; // spread colliding end labels
  const lyOf=si=>lys.find(l=>l.si===si).y;
  vs.keys.forEach((key,si)=>{ const m=vs.meta[key];
    g+=`<path class="line" stroke="${m.color}" d="${pts[si].map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join('')}"/>`;
    const ly=lyOf(si);
    g+=`<g class="endlbl"><circle cx="${W-MR+12}" cy="${ly}" r="4" fill="${m.color}"/>
        <text x="${W-MR+22}" y="${ly+4}">${m.name} ${m.fmt(last(pts[si]))}</text></g>`; });
  g+=`<line id="xh" class="crosshair" y1="${MT}" y2="${MT+ih}" x1="-9" x2="-9"/>
      <rect id="hit" x="${ML}" y="${MT}" width="${iw}" height="${ih}" fill="transparent"/>`;
  $('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-label="${vs.title}, ${state.range} trend">${g}</svg>`;
  chartGeom={pts,tAt,X,Y,ML,MR,MT,ih,iw,W,H,n,vs};
  $('chartTitle').textContent=vs.title;
  $('chartNow').textContent='· '+state.range+' · '+vs.unit;
  $('legend').innerHTML=vs.keys.length<2?'':vs.keys.map(key=>{const m=vs.meta[key];
    return `<span><i style="background:${m.color}"></i>${m.name}</span>`;}).join('');
  drawTable(); hookTooltip();
}
function drawTable(){
  const tv=$('tableView'); if(!state.table){tv.hidden=true;return;}
  const {pts,tAt,vs,n}=chartGeom, rows=Math.min(48,n), st=Math.max(1,Math.floor(n/rows));
  let h='<table><thead><tr><th>time</th>'+vs.keys.map(k=>`<th>${vs.meta[k].name}</th>`).join('')+'</tr></thead><tbody>';
  for(let i=n-1;i>=0;i-=st){ const t=new Date(tAt(i));
    h+=`<tr><td>${(t.getMonth()+1)}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</td>`
      + vs.keys.map((k,si)=>`<td>${vs.meta[k].fmt(pts[si][i])}</td>`).join('')+'</tr>'; }
  tv.innerHTML=h+'</tbody></table>'; tv.hidden=false;
}
function hookTooltip(){
  const svg=$('chart').querySelector('svg'), hit=svg.querySelector('#hit'), xh=svg.querySelector('#xh'), tt=$('tooltip');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), sx=chartGeom.W/r.width;
    const px=(ev.clientX-r.left)*sx, i=Math.max(0,Math.min(chartGeom.n-1,Math.round((px-chartGeom.ML)/chartGeom.iw*(chartGeom.n-1))));
    xh.setAttribute('x1',chartGeom.X(i)); xh.setAttribute('x2',chartGeom.X(i));
    const t=new Date(chartGeom.tAt(i)), vs=chartGeom.vs;
    tt.innerHTML=`<div class="tt-t">${(t.getMonth()+1)}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}</div>`
      + vs.keys.map((k,si)=>`<div class="tt-row"><i style="background:${vs.meta[k].color}"></i>${vs.meta[k].name}<b>${vs.meta[k].fmt(chartGeom.pts[si][i])}</b></div>`).join('');
    tt.style.display='block';
    const wrap=$('chart').parentElement.getBoundingClientRect();
    let lx=(ev.clientX-wrap.left)+18; if(lx+tt.offsetWidth>wrap.width-8) lx=(ev.clientX-wrap.left)-tt.offsetWidth-18;
    tt.style.left=lx+'px'; tt.style.top=Math.max(4,(ev.clientY-wrap.top)-tt.offsetHeight/2)+'px';
  };
  hit.addEventListener('pointermove',move);
  hit.addEventListener('pointerleave',()=>{tt.style.display='none';xh.setAttribute('x1',-9);xh.setAttribute('x2',-9);});
}
/* ---------------- bundle strip ------------------------------------ */
function drawBundles(){
  const strip=$('bundleStrip'), P=PLANTS[state.plant];
  if(!P.bundles){strip.className='bundles';strip.innerHTML='';return;}
  const d=dataFor('A');
  strip.className='bundles on';
  let h=`<div class="b-cap">bundle ΔP · limit ${f1(P.dpLimit)} inH₂O</div>`;
  for(let b=1;b<=8;b++){ const id='b0'+b, v=last(d[id]), pct=Math.min(1,v/P.dpLimit/1.15);
    const hot=v>=P.dpLimit*0.85;
    h+=`<button class="bundle${hot?' hot':''}${state.sensor===id?' sel':''}" data-sensor="${id}"
      aria-label="Bundle B0${b}, ${f2(v)} inches of water${hot?', approaching attention limit':''}">
      <span class="bar"><span class="lim" style="bottom:${(1/1.15*100).toFixed(1)}%"></span>
      <span class="fill" style="height:${(pct*100).toFixed(1)}%"></span></span>
      <span class="bv">${f2(v)}</span><span class="bl">B0${b}</span></button>`; }
  strip.innerHTML=h;
}
/* ---------------- render / interactions -------------------------- */
function renderSchematic(force){
  if(!force && $('schematic').contains(document.activeElement)) return; // don't yank keyboard focus
  TICK={};
  $('schematic').innerHTML=state.plant==='A'?schematicA():schematicB();
}
function renderPlant(){
  const k=state.plant, P=PLANTS[k];
  $('tabA').setAttribute('aria-selected',k==='A'); $('tabB').setAttribute('aria-selected',k==='B');
  $('plantName').textContent=P.name; $('plantDesc').textContent=P.desc;
  $('badges').innerHTML=P.badges.map(b=>`<span class="badge">${b}</span>`).join('');
  $('designList').innerHTML=Object.entries(P.design).map(([a,b])=>`<div class="row"><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  renderSchematic(true);
  $('presetPills').innerHTML=PRESETS[k].map(p=>
    `<button class="pill" data-preset="${p.id}" aria-pressed="${!state.sensor&&state.preset===p.id}">${p.label}</button>`).join('');
  $('rangePills').innerHTML=RANGES.map(r=>
    `<button class="pill" data-range="${r.id}" aria-pressed="${state.range===r.id}">${r.label}</button>`).join('');
  drawBundles(); drawChart();
}
function selectSensor(id){ state.sensor=id;
  document.querySelectorAll('#presetPills .pill').forEach(b=>b.setAttribute('aria-pressed','false'));
  document.querySelectorAll('.sensor,.bundle').forEach(el=>el.classList.toggle('sel',el.dataset.sensor===id));
  drawChart();
}
function selectPreset(id){ state.sensor=null; state.preset=id;
  document.querySelectorAll('#presetPills .pill').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===id)));
  document.querySelectorAll('.sensor,.bundle').forEach(el=>el.classList.remove('sel'));
  drawChart();
}
document.addEventListener('click',ev=>{
  const s=ev.target.closest('[data-sensor]'); if(s){wake();selectSensor(s.dataset.sensor);return;}
  const p=ev.target.closest('[data-preset]'); if(p){wake();selectPreset(p.dataset.preset);return;}
  const r=ev.target.closest('[data-range]'); if(r){wake();state.range=r.dataset.range;
    document.querySelectorAll('#rangePills .pill').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.range===state.range)));
    drawChart();return;}
});
document.addEventListener('keydown',ev=>{
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset&&ev.target.dataset.sensor){ev.preventDefault();wake();selectSensor(ev.target.dataset.sensor);}
});
$('tabA').addEventListener('click',()=>{wake();state.plant='A';state.sensor=null;state.preset='inout';renderPlant();});
$('tabB').addEventListener('click',()=>{wake();state.plant='B';state.sensor=null;state.preset='inout';renderPlant();});
$('tableToggle').addEventListener('click',()=>{state.table=!state.table;
  $('tableToggle').setAttribute('aria-pressed',String(state.table));drawTable();});
/* clock */
setInterval(()=>{const t=new Date();
  $('clock').textContent=[t.getHours(),t.getMinutes(),t.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');},1000);
/* ---------------- idle attract tour ------------------------------- */
const TOUR=[
  {plant:'A',preset:'inout',range:'24h'},{plant:'A',sensor:'b03',range:'30d'},
  {plant:'A',preset:'ttd',range:'30d'},{plant:'B',preset:'inout',range:'24h'},
  {plant:'B',preset:'bp',range:'7d'},{plant:'B',preset:'ttd',range:'30d'}];
let tourI=0, idleTimer=null, tourTimer=null;
function tourStep(){ const s=TOUR[tourI=(tourI+1)%TOUR.length];
  if(s.plant!==state.plant){state.plant=s.plant;}
  state.range=s.range; state.sensor=s.sensor||null; if(s.preset)state.preset=s.preset;
  renderPlant();
}
function startTour(){ if(reduceMotion)return; tourTimer=setInterval(tourStep,9000); }
function wake(){ clearInterval(tourTimer); clearTimeout(idleTimer);
  idleTimer=setTimeout(startTour,45000); }
['pointerdown','pointermove','keydown','wheel'].forEach(e=>document.addEventListener(e,wake,{passive:true}));
/* live jitter on the schematic chips every 2.5s */
if(!reduceMotion) setInterval(()=>renderSchematic(false),2500);
/* deep-linkable start state, e.g. ?plant=B&preset=ttd&range=30d or ?sensor=b03 */
const q=new URLSearchParams(location.search);
if(q.get('plant')) state.plant=q.get('plant').toUpperCase()==='B'?'B':'A';
if(q.get('preset')&&PRESETS[state.plant].some(p=>p.id===q.get('preset'))) state.preset=q.get('preset');
if(q.get('range')&&RANGES.some(r=>r.id===q.get('range'))) state.range=q.get('range');
if(q.get('sensor')&&SENSORS[state.plant].some(s=>s.id===q.get('sensor'))) state.sensor=q.get('sensor');
renderPlant(); wake();
</script>
